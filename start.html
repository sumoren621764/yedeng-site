<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="夜燈命書：和引路人一起排一張紫微命盤，或為心裡的一件事擲一卦。免費排盤，想看完整解讀再點一盞燈。"><meta name="theme-color" content="#05070d"><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><style>body{margin:0;padding:0;background:#05070d}img{max-width:100%}</style></head><body>
<title>夜燈命書｜紫微斗數・周易問卦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one full-screen scene. Video of the guide behind, gold star chart floating in the upper half, visual-novel dialogue box at the bottom. Committed night look. */
:root{
  --night:#05070d;
  --ink2:#0d1220;
  --line:rgba(216,180,106,.28);
  --gold:#d8b46a;
  --gold-dim:#8c7646;
  --cinnabar:#e0573f;
  --jade:#5fb39a;
  --fg:#e9e4d6;
  --mute:#9a9fae;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--night);color:var(--fg);overflow:hidden}
body{font-family:var(--sans)}
/* 不讓命盤、動畫被反白或長按選取；輸入框照常可選 */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg,video,canvas{-webkit-user-drag:none}
::selection{background:rgba(216,180,106,.28);color:inherit}
[hidden]{display:none!important}

.rt{position:fixed;inset:0;overflow:hidden;background:var(--night)}
.rt::before{content:"";position:absolute;inset:-40px;background:url(v/shot-wide.jpg) center/cover;filter:blur(36px) brightness(.32) saturate(1.1)}
.rt-bg{position:absolute;inset:0;transform-origin:50% 30%;opacity:0;transform:scale(var(--z,1.12)) translate(var(--tx,0),var(--ty,2%));transition:transform 3.2s cubic-bezier(.3,.1,.2,1),opacity 2.4s ease,filter 2s ease;filter:brightness(.35) saturate(.7)}
.rt.lit .rt-bg{opacity:1;filter:brightness(.95) saturate(1)}
.rt.lit.dim .rt-bg{filter:brightness(.5) saturate(.9)}
@media (min-aspect-ratio:3/4){.rt-bg{left:0;right:0;margin-inline:auto;width:min(100%,calc(100dvh*9/16));width:min(100%,round(calc(100dvh*9/16),2px));overflow:hidden;clip-path:inset(1px 1px);backface-visibility:hidden}.rt-bg::after{content:"";position:absolute;inset:-2px;z-index:1;pointer-events:none;box-shadow:inset 72px 0 60px -28px var(--night),inset -72px 0 60px -28px var(--night)}}
.clip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;opacity:0;transition:opacity 1.3s ease}
.clip.on{opacity:1}
.rt-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 50% 100%,rgba(224,87,63,.26),transparent 70%);animation:flicker 4s ease-in-out infinite;opacity:0;transition:opacity 2s}
.rt.lit .rt-glow{opacity:1}
@keyframes flicker{0%,100%{filter:brightness(1)}45%{filter:brightness(1.35)}55%{filter:brightness(.85)}}
.rt-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.rt-veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(5,7,13,.5),transparent 20%,transparent 46%,rgba(5,7,13,.92) 82%)}

/* opening */
.rt-intro{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:18px;text-align:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12vh);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .9s,transform .9s}
.rt-intro.out{opacity:0;transform:translateY(14px);pointer-events:none}
.rt-kicker{margin:0;font-size:.72rem;letter-spacing:.5em;color:var(--cinnabar);animation:in 1.6s .4s both}
.rt-title{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(2rem,9vw,3.2rem);line-height:1.3;letter-spacing:.18em;text-shadow:0 2px 24px rgba(0,0,0,.8);animation:in 2s .9s both;text-wrap:balance}
.rt-enter{all:unset;cursor:pointer;font-family:var(--serif);font-weight:700;letter-spacing:.4em;padding:14px 34px 14px 40px;border:1px solid var(--gold);color:var(--gold);border-radius:2px;background:rgba(5,7,13,.45);animation:in 1.6s 1.8s both,pulse 2.6s 3.4s ease-in-out infinite}
.rt-enter:hover,.rt-enter:focus-visible{background:var(--gold);color:var(--night)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(216,180,106,.12),0 0 30px rgba(216,180,106,.25)}}

/* floating star chart */
.chart{position:absolute;z-index:3;left:0;right:0;margin-inline:auto;top:46%;width:min(calc(100% - 32px),420px,44dvh);opacity:0;transform:translateY(-50%) scale(.35) translateY(60px);transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.2,.8,.2,1);pointer-events:none;filter:drop-shadow(0 0 10px rgba(216,180,106,.35))}
.chart.on{opacity:1;transform:translateY(-50%)}
.chart.away{opacity:0;transform:translateY(-50%) scale(1.1) translateY(-30px);transition:opacity 1.4s ease,transform 1.8s ease}
.chart svg{display:block;width:100%;height:auto}
/* 試閱：命盤留在上半部，邊講邊亮對應的宮位 */
.chart.read{top:calc(env(safe-area-inset-top,0px) + 4dvh + min(calc(100vw - 32px),360px,36dvh) / 2);width:min(calc(100% - 32px),360px,36dvh)}
.chart .fade.on.muted{opacity:.32;transition:opacity .6s ease}
.chart.read .frm{opacity:0}
.chart .focus rect{fill:rgba(216,180,106,.1);stroke-width:2.5;animation:glow 2.4s ease-in-out infinite}
.chart .focus text{font-size:11px;font-weight:700;letter-spacing:.08em}
@keyframes glow{50%{fill:rgba(216,180,106,.22);filter:drop-shadow(0 0 6px rgba(216,180,106,.7))}}
.rt.reading .rt-line{max-height:min(34dvh,42dvh)}
@media (min-aspect-ratio:3/4){.chart.read{top:calc(env(safe-area-inset-top,0px) + 3dvh + min(calc(100dvh*9/16 - 32px),480px,46dvh) / 2);width:min(calc(100dvh*9/16 - 32px),480px,46dvh)}.rt.reading .rt-line{max-height:26dvh}}
.cell{fill:rgba(8,11,20,.62);stroke:rgba(216,180,106,.35);stroke-width:1}
.cell.ming{stroke:var(--gold);stroke-width:2;fill:rgba(216,180,106,.1)}
.branch{font-family:var(--serif);font-size:13px;fill:rgba(233,228,214,.55)}
.pname{font-family:var(--sans);font-size:11px;fill:var(--gold);font-weight:700}
.star{font-family:var(--serif);font-size:15px;fill:#fff6e2;font-weight:700}
.hua{font-size:10px;font-weight:700}
.center-t{font-family:var(--serif);fill:var(--fg);text-anchor:middle}
.fade{opacity:0;transition:opacity .45s ease}
.fade.on{opacity:1}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;transform:translateY(-6px);transition:opacity .35s ease,transform .35s ease}
.pop.on{opacity:1;transform:none}
.link{fill:none;stroke-width:2;stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset 1s ease}
.link.on{stroke-dashoffset:0}

/* fortune slips */
.slips{position:absolute;z-index:3;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6vh);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;padding-inline:16px}
.slip{font-family:var(--serif);font-size:.95rem;letter-spacing:.08em;padding:8px 16px;border:1px solid rgba(216,180,106,.5);background:rgba(5,7,13,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:float-in 1s both}
.slip b{filter:blur(4px);user-select:none;color:var(--gold)}
@keyframes float-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* dialogue */
.rt-box{position:absolute;z-index:4;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rt-box>*{width:100%;max-width:520px;margin-inline:auto;box-sizing:border-box}
.rt-echo{margin:0 auto 10px;display:flex;justify-content:flex-end;font-size:.82rem;min-height:1.2em}
.rt-echo:empty{min-height:0;margin:0 auto}
.rt-echo b{color:var(--fg);font-weight:500;background:rgba(13,18,32,.82);border:1px solid rgba(216,180,106,.35);padding:4px 12px;border-radius:12px 12px 2px 12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);max-width:80%}
.rt-panel{position:relative;border:1px solid rgba(216,180,106,.35);border-radius:4px;background:linear-gradient(to bottom,rgba(13,18,32,.78),rgba(13,18,32,.93));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:26px 16px 16px;animation:in .8s both}
.rt-panel::before,.rt-panel::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--gold)}
.rt-panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.rt-panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.rt-plate{position:absolute;top:-14px;left:14px;background:var(--cinnabar);color:#fff;font-family:var(--serif);font-weight:900;letter-spacing:.3em;font-size:.9rem;padding:4px 12px 4px 14px;display:flex;align-items:baseline;gap:8px}
.rt-plate span{font-family:var(--sans);font-size:.62rem;font-weight:500;letter-spacing:.2em;opacity:.85}
.rt-topic{margin:0 0 4px;font-family:var(--serif);font-size:.8rem;letter-spacing:.3em;color:var(--gold)}
.rt-line{margin:0;font-family:var(--serif);font-size:1.06rem;line-height:1.85;min-height:3.7em;text-wrap:pretty;cursor:pointer;max-height:42dvh;overflow-y:auto}
.rt-line.long{font-size:.98rem}
.rt-line .veiled{filter:blur(5px);user-select:none;color:var(--mute);-webkit-mask-image:linear-gradient(to right,#000 40%,transparent);mask-image:linear-gradient(to right,#000 40%,transparent)}
.rt-line .caret{display:inline-block;width:7px;height:7px;margin-left:6px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg) translateY(-3px);animation:nudge 1s ease-in-out infinite}
.rt-line .tap{display:inline-block;width:0;height:0;margin-left:8px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--gold);animation:bob 1.1s ease-in-out infinite}
@keyframes nudge{50%{transform:rotate(45deg) translate(2px,-1px)}}
@keyframes bob{50%{transform:translateY(3px)}}
.rt-reply{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rt-reply:empty{display:none}
.rt-reply>*{animation:in .5s both}
.chip{all:unset;cursor:pointer;border:1px solid rgba(216,180,106,.55);border-radius:2px;padding:9px 16px;font-size:.9rem;color:var(--fg);text-align:center;background:rgba(5,7,13,.35);flex:1 1 auto}
.chip small{display:block;font-size:.64rem;color:var(--mute)}
.chip:hover,.chip:focus-visible{background:var(--gold);color:var(--night);border-color:var(--gold)}
.chip:hover small,.chip:focus-visible small{color:var(--night)}
.chip.main{background:var(--gold);color:var(--night);font-family:var(--serif);font-weight:700;letter-spacing:.2em}
.chip.big{flex-basis:100%;text-align:left;padding:12px 16px}
.chip.big small{font-size:.72rem;margin-top:2px}
.chip.lamp{flex-basis:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:13px 16px;font-family:var(--serif)}
.chip.lamp em{font-style:normal;font-family:var(--sans);font-weight:700;letter-spacing:0}
.chip.lamp small{font-family:var(--sans)}
.chip.lamp.main em{color:var(--night)}
.chip.lamp small{margin-top:3px}
.chip.lamp.main small{color:rgba(5,7,13,.72)}
.chip.add[aria-pressed="true"]{border-color:var(--jade);color:var(--jade)}
.chip.add[aria-pressed="true"]::before{content:"✓ "}
.chip.quiet{border-color:transparent;color:var(--mute);flex:0 1 auto;margin-left:auto}
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.hours .chip{padding:7px 2px}
.hours .wide{grid-column:span 4}
.field{display:flex;gap:8px;width:100%}
.field input{flex:1;min-width:0;background:rgba(5,7,13,.6);border:0;border-bottom:1px solid var(--gold-dim);color:var(--fg);padding:10px 4px;font:inherit;font-size:1.05rem;font-family:var(--serif);color-scheme:dark}
.field input:focus{outline:none;border-bottom-color:var(--gold)}
.field .chip{flex:none}
.err{width:100%;color:#ff8a73;font-size:.78rem;margin:0}

@media (prefers-reduced-motion:reduce){.chart .focus rect{animation:none}.rt-bg,.rt-intro,.chart{transition:opacity .3s}.rt-glow,.rt-enter,.rt-kicker,.rt-title,.rt-panel,.rt-reply>*,.slip{animation:none}.fade,.pop,.link{transition:none}}

/* v12 additions */
.dob{display:flex;flex-direction:column;gap:10px;width:100%}
.cal{display:flex;gap:6px}
.cal .chip{flex:0 0 auto;padding:6px 14px;font-size:.82rem}
.cal .chip[aria-pressed="true"]{background:rgba(216,180,106,.18);border-color:var(--gold);color:var(--gold)}
.sel{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.sel label{display:flex;flex-direction:column;gap:2px;font-size:.66rem;color:var(--mute);letter-spacing:.2em;min-width:0}
.sel select{appearance:none;-webkit-appearance:none;background:rgba(5,7,13,.6);border:0;border-bottom:1px solid var(--gold-dim);color:var(--fg);padding:9px 4px;font-family:var(--serif);font-size:1.05rem;border-radius:0;min-width:0;color-scheme:dark}
.sel select:focus{outline:none;border-bottom-color:var(--gold)}
.dob .row{display:flex;gap:8px;align-items:center}
.dob .row .err{flex:1}
.dob .row .chip{flex:0 0 auto;margin-left:auto}
.who{display:flex;flex-direction:column;gap:10px;width:100%}
.who input{background:rgba(5,7,13,.6);border:0;border-bottom:1px solid var(--gold-dim);color:var(--fg);padding:10px 4px;font-family:var(--serif);font-size:1.05rem}
.who input:focus{outline:none;border-bottom-color:var(--gold)}
.who .pair{display:flex;gap:8px}
.who .pair .chip{flex:1}
.snd{all:unset;cursor:pointer;position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));width:34px;height:34px;display:grid;place-items:center;opacity:.4;transition:opacity .3s}
.snd:hover,.snd:focus-visible{opacity:.9}
.snd svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:1.6}
.snd[aria-pressed="false"] .on,.snd[aria-pressed="true"] .off{display:none}
/* v13: 命書付費頁 */
.pin{all:unset;cursor:pointer;align-self:flex-end;font-family:var(--serif);font-size:.82rem;letter-spacing:.15em;color:var(--gold);border:1px solid rgba(216,180,106,.55);background:rgba(5,7,13,.55);padding:6px 12px;animation:in .6s both}
.pin:hover,.pin:focus-visible{background:var(--gold);color:var(--night)}
.book{position:absolute;z-index:6;left:0;right:0;bottom:0;max-height:86dvh;display:flex;flex-direction:column;background:linear-gradient(to bottom,rgba(13,18,32,.94),rgba(8,11,20,.98));border-top:1px solid rgba(216,180,106,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transform:translateY(100%);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.book.on{transform:none}
.book-in{overflow-y:auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.book-in>*{width:100%;max-width:520px;margin-inline:auto;box-sizing:border-box}
.book-x{all:unset;cursor:pointer;position:absolute;top:8px;right:max(10px,env(safe-area-inset-right,0px));width:36px;height:36px;display:grid;place-items:center;color:var(--mute);font-size:1.3rem}
.book-x:focus-visible{outline:1px solid var(--gold)}
.book h2{margin:0;font-family:var(--serif);font-weight:900;font-size:1.45rem;letter-spacing:.12em}
.book .kick{margin:0 0 6px;font-size:.7rem;letter-spacing:.4em;color:var(--cinnabar)}
.book .meta{margin:6px 0 0;font-size:.8rem;color:var(--mute);letter-spacing:.08em}
.book h3{margin:0 0 8px;font-family:var(--serif);font-size:.86rem;letter-spacing:.3em;color:var(--gold);font-weight:700}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.toc li{display:grid;grid-template-columns:4.2em 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem;line-height:1.6}
.toc li b{font-family:var(--serif);color:var(--gold);font-weight:700;font-size:.82rem;letter-spacing:.1em}
.toc li small{display:block;color:var(--mute);font-size:.76rem}
.tease{display:flex;flex-wrap:wrap;gap:8px}
.tease span{font-family:var(--serif);font-size:.86rem;padding:6px 12px;border:1px solid rgba(216,180,106,.4)}
.tease b{filter:blur(4px);color:var(--gold);user-select:none}
.plans{display:flex;flex-direction:column;gap:8px}
.plan-opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px 14px;border:1px solid rgba(216,180,106,.35);cursor:pointer}
.plan-opt:has(input:checked){border-color:var(--gold);background:rgba(216,180,106,.1)}
.plan-opt input{accent-color:var(--gold);width:18px;height:18px;margin:0}
.plan-opt span{font-family:var(--serif);font-size:1rem}
.plan-opt small{display:block;font-family:var(--sans);font-size:.74rem;color:var(--mute);margin-top:2px}
.plan-opt em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;line-height:1.6;color:var(--fg);cursor:pointer}
.check input{accent-color:var(--gold);width:17px;height:17px;margin:2px 0 0;flex:none}
.check.opt{color:var(--mute)}
.mail{display:flex;flex-direction:column;gap:4px;font-size:.72rem;letter-spacing:.2em;color:var(--mute)}
.mail input{background:rgba(5,7,13,.6);border:0;border-bottom:1px solid var(--gold-dim);color:var(--fg);padding:9px 4px;font-size:1rem;letter-spacing:0;font-family:var(--sans)}
.mail input:focus{outline:none;border-bottom-color:var(--gold)}
.faq{display:flex;flex-direction:column;gap:2px}
.faq details{border-bottom:1px solid var(--line);padding:10px 0}
.faq summary{cursor:pointer;font-size:.88rem;list-style:none;display:flex;justify-content:space-between}
.faq summary::after{content:"＋";color:var(--gold)}
.faq details[open] summary::after{content:"－"}
.faq p{margin:8px 0 0;font-size:.82rem;line-height:1.7;color:var(--mute)}
.fine{margin:0;font-size:.72rem;color:var(--mute);line-height:1.6}
.book-bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:rgba(5,7,13,.96)}
.book-bar>.err:empty{display:none}.book-bar>.err{flex-basis:100%}
.book-bar>*{box-sizing:border-box}.book-bar{justify-content:center}.book-bar>.paybtn{max-width:380px}
.book-bar .err{text-align:center}
.paybtn{all:unset;cursor:pointer;box-sizing:border-box;text-align:center;background:var(--gold);color:var(--night);font-family:var(--serif);font-weight:900;letter-spacing:.18em;font-size:.98rem;padding:11px 14px;flex:1;border-radius:2px}
.paybtn:hover,.paybtn:focus-visible{filter:brightness(1.08)}
.paybtn[aria-disabled="true"]{opacity:.5}
.later{all:unset;cursor:pointer;text-align:center;font-size:.82rem;color:var(--mute);padding:11px 6px;flex:none}
.rt-box>.pin{width:auto;max-width:none;margin-inline:0;margin-right:max(0px,calc((100% - 520px) / 2))}
.book{padding-top:40px}
.book-x{top:4px}
.rt-foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;padding-inline:16px;font-size:.7rem;letter-spacing:.08em;animation:in 1.6s 2.4s both}
.rt-foot a{color:rgba(233,228,214,.55);text-decoration:none}
.rt-foot a:hover,.rt-foot a:focus-visible{color:var(--gold)}
.check a{color:var(--gold)}

/* ---- 周易問卦 ---- */
.gua{position:absolute;z-index:3;left:0;right:0;margin-inline:auto;top:31%;width:min(calc(100% - 32px),360px);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transform:translateY(20px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.gua.on{opacity:1;transform:none}
.gua.away{opacity:0;transform:translateY(-24px) scale(.96)}
.coins{display:flex;gap:18px;perspective:600px;transition:opacity .6s,height .6s}
.gua.done{top:22%}.gua.done .coins,.gua.done .gval{opacity:0;height:0;overflow:hidden}
.coin{--c1:#e7c27a;--c2:#8a5a22;position:relative;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--c1),#b8873f 55%,var(--c2));box-shadow:0 0 0 3px #6b4318 inset,0 0 0 7px rgba(255,230,170,.18) inset,0 6px 16px rgba(0,0,0,.55),0 0 18px rgba(231,194,122,.35);transform-style:preserve-3d;display:grid;place-items:center}
.coin::after{content:"";position:absolute;width:15px;height:15px;background:#1a120b;box-shadow:0 0 0 2px #6b4318}
.coin b{position:absolute;inset:0;font:700 13px/1 "Noto Serif TC",serif;color:#4a2c0c;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:8px 0;opacity:0;transition:opacity .2s}.coin s{text-decoration:none}
.coin.zi b{opacity:.9}
.coin.bei{--c1:#d9b26a;--c2:#6d461a}
.coin.spin{animation:cspin 1s cubic-bezier(.3,.6,.3,1)}
.coin.spin:nth-child(2){animation-duration:.92s}.coin.spin:nth-child(3){animation-duration:1.06s}
@keyframes cspin{0%{transform:translateY(0) rotateY(0)}40%{transform:translateY(-70px) rotateY(900deg)}100%{transform:translateY(0) rotateY(1800deg)}}
.gval{margin:0;font-size:.82rem;letter-spacing:.12em;color:#f3e7c9;text-shadow:0 1px 6px #000;min-height:1.2em;transition:opacity .6s}
.hex{display:flex;flex-direction:column-reverse;gap:9px;width:100%;padding:12px 0}
.ln{display:grid;grid-template-columns:44px 1fr 22px;align-items:center;gap:10px;opacity:0;transform:scaleX(.4);transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1)}
.ln.on{opacity:1;transform:none}
.ln small{font-size:.7rem;color:rgba(243,231,201,.85);text-shadow:0 1px 4px #000,0 0 8px #000;text-align:right;letter-spacing:.1em}
.ln .bar{display:flex;gap:0;height:12px}
.ln .bar i{flex:1;background:linear-gradient(#f6dc9c,#c9953f);border-radius:2px;box-shadow:0 0 12px rgba(246,220,156,.55)}
.ln.yin .bar{gap:18%}
.ln.yang .bar i+i{display:none}
.ln.chg .bar i{background:linear-gradient(#ff9b7a,#e0573f);box-shadow:0 0 14px rgba(224,87,63,.7)}
.ln em{font-style:normal;color:#e0573f;font-size:.95rem;text-align:center}
.gname{display:flex;align-items:center;gap:16px;font:700 1.35rem/1.2 "Noto Serif TC",serif;color:#f3e7c9;text-shadow:0 2px 10px #000}
.gname span,.gpair span{display:flex;align-items:center;gap:8px}
.gname b,.gpair b{font-weight:400;font-size:1.6em;color:#e7c27a}
.gname i,.gpair i{font-style:normal;color:#e0573f}
.gcard{border:1px solid rgba(231,194,122,.3);border-radius:12px;padding:14px 16px;background:rgba(231,194,122,.06)}
.gpair{display:flex;align-items:center;gap:14px;font:700 1.15rem "Noto Serif TC",serif;margin-bottom:8px}
.gtxt{margin:0 0 6px;font-family:"Noto Serif TC",serif;line-height:1.8}
.gcard small{opacity:.7;font-size:.75rem}
@media (prefers-reduced-motion:reduce){.coin.spin{animation:none}.gua,.ln{transition:opacity .3s}}

/* ---- 命定對象畫像 ---- */

.cpn{display:flex;flex-direction:column;gap:4px}.cpn-row{display:flex;gap:8px}.cpn-row input{flex:1;min-width:0;background:rgba(5,7,13,.6);border:0;border-bottom:1px solid var(--gold-dim);color:var(--fg);padding:9px 4px;font-size:1rem;font-family:var(--sans);text-transform:uppercase}.cpn-row input:focus{outline:none;border-bottom-color:var(--gold)}.cpn-row .chip{flex:none;padding:6px 14px}
.book .hint{margin:6px 0 0;font-size:.72rem;color:var(--mute);line-height:1.6}

<script>
(()=>{
const $=id=>document.getElementById(id);
const rt=$("rt"),bg=$("rt-bg"),line=$("rt-line"),reply=$("rt-reply"),echo=$("rt-echo"),topic=$("rt-topic"),chart=$("chart"),slips=$("slips");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?Math.min(ms,80):ms));
const S={};
let token=0,skipType=null;

/* ---------------- 追蹤（正式版接 Meta Pixel / GA4） ---------------- */
window.dataLayer=window.dataLayer||[];
function track(event,props={}){const e={event,mode:S.mode||null,price_group:PRICE.group,...props};window.dataLayer.push(e);if(window.fbq)try{fbq("trackCustom",event,props)}catch(_){}}

/* ---------------- 價格分組 A/B ---------------- */
const GROUPS={a:{std:490,vip:990,add:290,ask1:290,ask3:690,gua1:99,gua3:249},b:{std:1280,vip:1980,add:650,ask1:390,ask3:890,gua1:199,gua3:490}};
const PRICE={group:"a",...GROUPS.a,ystd:490,yvip:990},PROMO={},LIST={};  /* 先用預設值，載入後以後端 /products 為準 */
try{YD.api("/products").then(d=>{(d.items||[]).forEach(i=>{PRICE[i.code]=i.price;PROMO[i.code]=i.promo_label||"";LIST[i.code]=i.list_price||0})}).catch(()=>{})}catch(_){}
const pc=p=>S.mode==="year"?(p==="vip"?"yvip":"ystd"):p;
const ptag=c=>LIST[c]>PRICE[c]
  ?`<span class="pz"><s class="was">${nt(LIST[c])}</s><b class="now">${nt(PRICE[c])}</b>${PROMO[c]?`<small class="promo">${esc(PROMO[c])}</small>`:""}</span>`
  :`<span class="pz"><b class="now">${nt(PRICE[c])}</b>${PROMO[c]?`<small class="promo">${esc(PROMO[c])}</small>`:""}</span>`;
/* 優惠碼欄位：試算只是預覽，實際以建立訂單時的檢查為準 */
const cpnHtml=()=>`<div class="cpn"><label class="mail" for="bk-cpn">優惠碼（選填）</label><div class="cpn-row"><input id="bk-cpn" maxlength="32" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="有優惠碼就填這裡"><button type="button" class="chip" id="bk-cpn-go">套用</button></div><p class="hint" id="bk-cpn-msg" role="status"></p></div>`;
function cpnBind(items,onChange){let cur=null;const inp=$("bk-cpn"),msg=$("bk-cpn-msg"),go=$("bk-cpn-go");
  const run=code=>{if(!code){cur=null;msg.textContent="";onChange(null);return}go.disabled=true;
    YD.api("/coupons/check",{method:"POST",body:{code,items:items()}}).then(d=>{cur=d;msg.textContent=`已套用「${d.name||d.code}」，折 ${nt(d.discount)}`;msg.style.color="var(--jade)";onChange(d);track("coupon_ok",{code:d.code})})
    .catch(e=>{cur=null;msg.textContent=e.message;msg.style.color="#ff8a73";onChange(null)}).then(()=>{go.disabled=false})};
  go.onclick=()=>run(inp.value.trim());inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();run(inp.value.trim())}};
  return{recheck:()=>{if(cur)run(cur.code)},code:()=>cur?cur.code:null}}
const nt=n=>"NT$"+n.toLocaleString("en-US");

/* ---------------- 聲音（程式合成，無音檔） ---------------- */
const Snd={ctx:null,master:null,on:true,
  start(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=this.ctx=new C();
    const m=this.master=ctx.createGain();m.gain.value=0;m.connect(ctx.destination);m.gain.linearRampToValueAtTime(this.on?.9:0,ctx.currentTime+3);
    const len=ctx.sampleRate*3,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2}
    const n=ctx.createBufferSource();n.buffer=buf;n.loop=true;const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=420;const wg=ctx.createGain();wg.gain.value=.16;
    const lfo=ctx.createOscillator();lfo.frequency.value=.07;const lg=ctx.createGain();lg.gain.value=.08;lfo.connect(lg);lg.connect(wg.gain);
    n.connect(lp);lp.connect(wg);wg.connect(m);n.start();lfo.start();this.wind=lp;
    const dg=ctx.createGain();dg.gain.value=.022;dg.connect(m);[110,110.6,164.8].forEach(f=>{const o=ctx.createOscillator();o.type="sine";o.frequency.value=f;o.connect(dg);o.start()});
    const chimeLoop=()=>{if(!this.ctx)return;this.chime([1318.5,1568,1760,2093,2349.3][Math.floor(Math.random()*5)],.035,3.5);setTimeout(chimeLoop,4000+Math.random()*6000)};setTimeout(chimeLoop,2500);
  }catch(_){this.ctx=null}},
  chime(f,g=.05,dur=2.5){const ctx=this.ctx;if(!ctx)return;const t=ctx.currentTime;const o=ctx.createOscillator(),o2=ctx.createOscillator(),e=ctx.createGain();o.type="sine";o.frequency.value=f;o2.type="sine";o2.frequency.value=f*2.76;const e2=ctx.createGain();e2.gain.value=.25;
    o2.connect(e2);e2.connect(e);o.connect(e);e.connect(this.master);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.01);e.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o2.start(t);o.stop(t+dur);o2.stop(t+dur)},
  pluck(i){this.chime([523.3,587.3,659.3,784,880,1046.5][i%6],.03,1.4)},
  gong(){this.chime(98,.12,6);this.chime(196.5,.05,5)},
  sweep(){const ctx=this.ctx;if(!ctx||!this.wind)return;const t=ctx.currentTime;this.wind.frequency.cancelScheduledValues(t);this.wind.frequency.setValueAtTime(420,t);this.wind.frequency.linearRampToValueAtTime(2600,t+2.5);this.wind.frequency.linearRampToValueAtTime(420,t+5);[1046.5,1318.5,1568,2093].forEach((f,i)=>setTimeout(()=>this.chime(f,.04,3),i*350))},
  toggle(){this.on=!this.on;if(this.master)this.master.gain.setTargetAtTime(this.on?.9:0,this.ctx.currentTime,.3);return this.on}};
$("snd").onclick=()=>{const on=Snd.toggle();$("snd").setAttribute("aria-pressed",on);$("snd").setAttribute("aria-label",on?"關閉聲音":"開啟聲音")};

/* ---------------- 蝴蝶粒子 ---------------- */
const cv=$("rt-fx"),cx=cv.getContext("2d");let W=0,H=0,flies=[],burst=false,running=false;
function resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
function fly(){return{x:Math.random()*W,y:H*(.25+Math.random()*.7),s:5+Math.random()*7,ph:Math.random()*6,vx:(Math.random()-.5)*.35,vy:-.15-Math.random()*.3,a:0}}
function tick(t){
  cx.clearRect(0,0,W,H);
  for(const f of flies){
    f.x+=f.vx*(burst?6:1)+Math.sin(t/900+f.ph)*.3;f.y+=f.vy*(burst?9:1);f.a=Math.min(1,f.a+.01);
    if((f.y<-20||f.x<-20||f.x>W+20)&&!burst)Object.assign(f,fly(),{y:H+10});
    const flap=Math.abs(Math.sin(t/140+f.ph));
    cx.save();cx.translate(f.x,f.y);cx.globalAlpha=f.a*.85;cx.shadowColor="rgba(150,185,255,.9)";cx.shadowBlur=14;cx.fillStyle="rgba(190,210,255,.75)";
    for(const side of[-1,1]){cx.beginPath();cx.ellipse(side*f.s*.55*flap,-f.s*.2,f.s*.6*flap+.6,f.s*.75,side*.5,0,7);cx.fill();cx.beginPath();cx.ellipse(side*f.s*.4*flap,f.s*.45,f.s*.35*flap+.4,f.s*.45,side*.3,0,7);cx.fill()}
    cx.restore();
  }
  if(!reduce)requestAnimationFrame(tick);
}
function startFx(n=9){resize();flies=Array.from({length:n},fly);burst=false;if(reduce)tick(0);else if(!running){running=true;requestAnimationFrame(tick)}}
function scatter(){burst=true;for(let i=0;i<26;i++)flies.push(Object.assign(fly(),{a:1}));setTimeout(()=>{burst=false;flies=Array.from({length:7},fly)},2600)}
addEventListener("resize",resize);

/* ---------------- 鏡頭 ---------------- */
const SHOTS={wide:["wide",1.06,"0","2%"],face:["face",1,"0","0"],close:["face",1.07,"0","2%"],hand:["hand",1,"0","0"],mid:["wide",1.12,"0","4%"],read:["read",1,"0","0"],hush:["hush",1,"0","0"],cast:["cast",1,"0","0"],toss:["toss",1,"0","0"]};
const FALLBACK={read:["wide",1.18,"0","6%"],hush:["face",1.1,"0","3%"],cast:["wide",1.3,"0","10%"],toss:["hand",1.06,"0","2%"]};
const clips={};document.querySelectorAll(".clip").forEach(v=>{clips[v.dataset.clip]=v;v.addEventListener("error",()=>v.dataset.bad="1",{once:true})});
const ok=c=>{const v=clips[c];return v&&!v.dataset.bad&&v.networkState!==3};
function shot(k){
  let [c,z,tx,ty]=SHOTS[k];
  if(!ok(c))[c,z,tx,ty]=FALLBACK[k]||SHOTS.wide;
  for(const n in clips){const on=n===c;clips[n].classList.toggle("on",on);if(on){if(n==="cast")clips[n].currentTime=0;const p=clips[n].play();p&&p.catch(()=>{})}}
  bg.style.setProperty("--z",z);bg.style.setProperty("--tx",tx);bg.style.setProperty("--ty",ty);
  return c;
}

/* ---------------- 對話元件 ---------------- */
async function say(text,t,{tap=false,long=false,veiled=""}={}){
  line.classList.toggle("long",long);line.textContent="";let done=reduce;skipType=()=>done=true;
  for(const ch of text){if(t!==token)return;if(done){line.textContent=text;break}line.textContent+=ch;line.scrollTop=line.scrollHeight;await wait("，。…？！".includes(ch)?220:42)}
  skipType=null;if(t!==token)return;
  if(veiled){const v=document.createElement("span");v.className="veiled";v.setAttribute("aria-hidden","true");v.textContent=veiled;line.appendChild(v)}
  const c=document.createElement("span");c.className=tap?"tap":"caret";line.appendChild(c);
  if(tap){await new Promise(r=>{const go=()=>{line.removeEventListener("click",go);rt.removeEventListener("keydown",key);r()};const key=e=>{if(e.key==="Enter"||e.key===" ")go()};line.addEventListener("click",go);rt.addEventListener("keydown",key)})}
  else await wait(380);
}
line.addEventListener("click",()=>skipType&&skipType());
function said(text){echo.innerHTML=text?"<b></b>":"";if(text)echo.firstChild.textContent=text}
function setTopic(t){topic.hidden=!t;topic.textContent=t||""}
function chips(opts,cls){return new Promise(res=>{reply.innerHTML="";const box=cls?Object.assign(document.createElement("div"),{className:cls}):reply;if(cls)reply.appendChild(box);
  opts.forEach((o,i)=>{const b=document.createElement("button");b.type="button";b.className="chip"+(o.cls?" "+o.cls:"");b.innerHTML=o.html||o.label;b.style.animationDelay=(i*50)+"ms";
    if(o.toggle){b.setAttribute("aria-pressed","false");b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);o.toggle(on)}}
    else b.onclick=()=>{reply.innerHTML="";res(o)};box.appendChild(b)})})}
function field(type,ph,check,skipLabel){return new Promise(res=>{reply.innerHTML="";
  const f=document.createElement("form");f.className="field";const i=document.createElement("input");i.type=type;i.placeholder=ph;i.id="rt-in-"+type;i.setAttribute("aria-label",ph);i.autocomplete=type==="email"?"email":"off";
  const b=document.createElement("button");b.className="chip";b.type="submit";b.textContent="告訴她";f.append(i,b);reply.appendChild(f);
  const e=document.createElement("p");e.className="err";
  if(skipLabel){const k=document.createElement("button");k.type="button";k.className="chip quiet";k.textContent=skipLabel;k.onclick=()=>{reply.innerHTML="";res(null)};reply.appendChild(k)}
  f.onsubmit=ev=>{ev.preventDefault();const v=i.value.trim();const bad=check&&check(v);if(bad){e.textContent=bad;reply.appendChild(e);return}reply.innerHTML="";res(v)};
  setTimeout(()=>i.focus({preventScroll:true}),60)})}
/* 名字＋性別一次問完 */
function whoForm(ph,labels){return new Promise(res=>{reply.innerHTML="";
  const f=document.createElement("form");f.className="who";const i=document.createElement("input");i.placeholder=ph;i.id="rt-in-who-"+labels[0].length;i.setAttribute("aria-label",ph);i.autocomplete="off";
  const row=document.createElement("div");row.className="pair";const e=document.createElement("p");e.className="err";

const GUA=[{"id":"111111","name":"乾","sym":"䷀","ci":"乾：元亨，利貞。","xiang":"天行健，君子以自強不息。","yao":["初九：潛龍，勿用。","九二：見龍在田，利見大人。","九三：君子終日乾乾，夕惕若，厲，無咎。","九四：或躍在淵，無咎。","九五：飛龍在天，利見大人。","上九：亢龍有悔。","用九：見群龍無首，吉。"],"m":"天行健，主動與力量都在你手上，但要懂得收放。"},{"id":"000000","name":"坤","sym":"䷁","ci":"坤：元亨，利牝馬之貞。君子有攸往，先迷後得主，利西南得朋，東北喪朋。安貞，吉。","xiang":"地勢坤，君子以厚德載物。","yao":["初六：履霜，堅冰至。","六二：直，方，大，不習無不利。","六三：含章可貞。或從王事，無成有終。","六四：括囊；無咎，無譽。","六五：黃裳，元吉。","上六：龍戰於野，其血玄黃。","用六：利永貞。"],"m":"順勢而為，用包容與耐心承載，先跟隨、後得主。"},{"id":"100010","name":"屯","sym":"䷂","ci":"元亨，利貞，勿用有攸往，利建侯。","xiang":"雲，雷，屯；君子以經綸。","yao":["初九：磐桓；利居貞，利建侯。","六二：屯如邅如，乘馬班如。匪寇婚媾，女子貞不字，十年乃字。","六三：即鹿無虞，惟入於林中，君子幾不如舍，往吝。","六四：乘馬班如，求婚媾，往吉，無不利。","九五：屯其膏，小貞吉，大貞凶。","上六：乘馬班如，泣血漣如。"],"m":"萬事起頭難，草創期先站穩，不宜躁進。"},{"id":"010001","name":"蒙","sym":"䷃","ci":"蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。","xiang":"山下出泉，蒙；君子以果行育德。","yao":["初六：發蒙，利用刑人，用說桎梏，以往吝。","九二：包蒙吉；納婦吉；子克家。","六三：勿用娶女；見金夫，不有躬，無攸利。","六四：困蒙，吝。","六五：童蒙，吉。","上九：擊蒙；不利為寇，利禦寇。"],"m":"還在摸索，最好的做法是虛心請教、先學再動。"},{"id":"111010","name":"需","sym":"䷄","ci":"需：有孚，光亨，貞吉。利涉大川。","xiang":"雲上於天，需；君子以飲食宴樂。","yao":["初九：需於郊。利用恒，無咎。","九二：需於沙。小有言，終吉。","九三：需於泥，致寇至。","六四：需於血，出自穴。","九五：需於酒食，貞吉。","上六：入於穴，有不速之客三人來，敬之終吉。"],"m":"時機未到，等待不是停滯，是準備。"},{"id":"010111","name":"訟","sym":"䷅","ci":"訟：有孚，窒。惕中吉。終凶。利見大人，不利涉大川。","xiang":"天與水違行，訟；君子以作事謀始。","yao":["初六：不永所事，小有言，終吉。","九二：不克訟，歸而逋，其邑人三百戶，無眚。","六三：食舊德，貞厲，終吉，或從王事，無成。","九四：不克訟，復即命渝，安貞吉。","九五：訟元吉。","上九：或錫之鞶帶，終朝三褫之。"],"m":"容易起爭執，退一步、求和解，比爭到底更有利。"},{"id":"010000","name":"師","sym":"䷆","ci":"貞，丈人，吉無咎。","xiang":"地中有水，師；君子以容民畜眾。","yao":["初六：師出以律，否臧凶。","九二：在師中吉，無咎，王三錫命。","六三：師或輿屍，凶。","六四：師左次，無咎。","六五：田有禽，利執言，無咎。長子帥師，弟子輿屍，貞凶。","上六：大君有命，開國承家，小人勿用。"],"m":"需要組織與紀律，找對帶頭的人，按部就班。"},{"id":"000010","name":"比","sym":"䷇","ci":"吉。原筮元永貞，無咎。不寧方來，後夫凶。","xiang":"地上有水，比；先王以建萬國，親諸侯。","yao":["初六：有孚，比之，無咎。有孚盈缶，終來有他，吉。","六二：比之自內，貞吉。","六三：比之匪人。","六四：外比之，貞吉。","九五：顯比，王用三驅，失前禽。邑人不誡，吉。","上六：比之無首，凶。"],"m":"親近與合作，找到值得依靠的人，一起走。"},{"id":"111011","name":"小畜","sym":"䷈","ci":"小畜：亨。密雲不雨，自我西郊。","xiang":"風行天上，小畜；君子以懿文德。","yao":["初九：復自道，何其咎，吉。","九二：牽復，吉。","九三：輿說輻，夫妻反目。","六四：有孚，血去惕出，無咎。","九五：有孚攣如，富以其鄰。","上九：既雨既處，尚德載，婦貞厲。月幾望，君子征凶。"],"m":"小有積蓄、力量還不夠，先累積，別急著求大成。"},{"id":"110111","name":"履","sym":"䷉","ci":"履虎尾，不咥人，亨。","xiang":"上天下澤，履；君子以辨上下，安民誌。","yao":["初九：素履，往無咎。","九二：履道坦坦，幽人貞吉。","六三：眇能視，跛能履，履虎尾，咥人，凶。武人為於大君。","九四：履虎尾，訴訴，終吉。","九五：夬履，貞厲。","上九：視履考祥，其旋元吉。"],"m":"如履虎尾，小心謹慎地前進，守禮就能過關。"},{"id":"111000","name":"泰","sym":"䷊","ci":"泰：小往大來，吉亨。","xiang":"天地交泰，後以財成天地之道，輔相天地之宜，以左右民。","yao":["初九：拔茅茹，以其彙，征吉。","九二：包荒，用馮河，不遐遺，朋亡，得尚於中行。","九三：無平不陂，無往不復，艱貞無咎。勿恤其孚，於食有福。","六四：翩翩，不富，以其鄰，不戒以孚。","六五：帝乙歸妹，以祉元吉。","上六：城復於隍，勿用師。自邑告命，貞吝。"],"m":"天地交泰，上下通暢，是順利、和諧的時候。"},{"id":"000111","name":"否","sym":"䷋","ci":"否之匪人，不利君子貞，大往小來。","xiang":"天地不交，否；君子以儉德辟難，不可榮以祿。","yao":["初六：拔茅茹，以其匯，貞吉亨。","六二：包承。小人吉，大人否，亨。","六三：包羞。","九四：有命，無咎，疇離祉。","九五：休否，大人吉。其亡其亡，系於苞桑。","上九：傾否，先否後喜。"],"m":"上下不通，暫時閉塞，守住自己，等待轉機。"},{"id":"101111","name":"同人","sym":"䷌","ci":"同人於野，亨。利涉大川，利君子貞。","xiang":"天與火，同人；君子以類族辨物。","yao":["初九：同人於門，無咎。","六二：同人於宗，吝。","九三：伏戎於莽，升其高陵，三歲不興。","九四：乘其墉，弗克攻，吉。","九五：同人，先號啕而後笑。大師克相遇。","上九：同人於郊，無悔。"],"m":"與人同心，合作與共識會帶來突破。"},{"id":"111101","name":"大有","sym":"䷍","ci":"大有：元亨。","xiang":"火在天上，大有；君子以遏惡揚善，順天休命。","yao":["初九：無交害，匪咎，艱則無咎。","六二：同人於宗，吝。","九三：公用亨於天子，小人弗克。","九四：匪其彭，無咎。","六五：厥孚交如，威如；吉。","上九：自天佑之，吉無不利。"],"m":"收穫豐盛，資源在手，懂得分享就能長久。"},{"id":"001000","name":"謙","sym":"䷎","ci":"謙：亨，君子有終。","xiang":"地中有山，謙；君子以裒多益寡，稱物平施。","yao":["初六：謙謙君子，用涉大川，吉。","六二：鳴謙，貞吉。","九三：勞謙，君子有終，吉。","六四：無不利，撝謙。","六五：不富，以其鄰，利用侵伐，無不利。","上六：鳴謙，利用行師，征邑國。"],"m":"謙虛反而得益，低調做事，會被看見。"},{"id":"000100","name":"豫","sym":"䷏","ci":"豫：利建侯，行師。","xiang":"雷出地奮，豫。先王以作樂崇德，殷薦之上帝，以配祖考。","yao":["初六：鳴豫，凶。","六二：介於石，不終日，貞吉。","六三：盱豫，悔。遲有悔。","九四：由豫，大有得。勿疑。朋盍簪。","六五：貞疾，恒不死。","上六：冥豫，成有渝，無咎。"],"m":"心情愉悅、時機成熟，可以準備行動，但別鬆懈。"},{"id":"100110","name":"隨","sym":"䷐","ci":"隨：元亨利貞，無咎。","xiang":"澤中有雷，隨；君子以向晦入宴息。","yao":["初九：官有渝，貞吉。出門交有功。","六二：系小子，失丈夫。","六三：系丈夫，失小子。隨有求得，利居貞。","九四：隨有獲，貞凶。有孚在道，以明，何咎。","九五：孚於嘉，吉。","上六：拘系之，乃從維之。王用亨於西山。"],"m":"順應變化、跟隨對的人事，不必逞強。"},{"id":"011001","name":"蠱","sym":"䷑","ci":"蠱：元亨，利涉大川。先甲三日，後甲三日。","xiang":"山下有風，蠱；君子以振民育德。","yao":["初六：幹父之蠱，有子，考無咎，厲終吉。","九二：幹母之蠱，不可貞。","九三：幹父之蠱，小有悔，無大咎。","六四：裕父之蠱，往見吝。","六五：幹父之蠱，用譽。","上九：不事王侯，高尚其事。"],"m":"舊問題浮上來，正是整頓、修補的時候。"},{"id":"110000","name":"臨","sym":"䷒","ci":"臨：元，亨，利，貞。至於八月有凶。","xiang":"澤上有地，臨；君子以教思無窮，容保民無疆。","yao":["初九：咸臨，貞吉。","九二：咸臨，吉無不利。","六三：甘臨，無攸利。既憂之，無咎。","六四：至臨，無咎。","六五：知臨，大君之宜，吉。","上六：敦臨，吉無咎。"],"m":"機會正在靠近，主動面對、用心經營。"},{"id":"000011","name":"觀","sym":"䷓","ci":"觀：盥而不薦，有孚顒若。","xiang":"風行地上，觀；先王以省方，觀民設教。","yao":["初六：童觀，小人無咎，君子吝。","六二：窺觀，利女貞。","六三：觀我生，進退。","六四：觀國之光，利用賓於王。","九五：觀我生，君子無咎。","上九：觀其生，君子無咎。"],"m":"先觀察、看清楚全局，再決定怎麼做。"},{"id":"100101","name":"噬嗑","sym":"䷔","ci":"噬嗑：亨。利用獄。","xiang":"雷電噬嗑；先王以明罰敕法。","yao":["初九：屨校滅趾，無咎。","六二：噬膚滅鼻，無咎。","六三：噬臘肉，遇毒；小吝，無咎。","九四：噬乾胏，得金矢，利艱貞，吉。","六五：噬乾肉，得黃金，貞厲，無咎。","上九：何校滅耳，凶。"],"m":"有障礙卡在中間，要明快處理，必要時立規矩。"},{"id":"101001","name":"賁","sym":"䷕","ci":"賁：亨。小利有攸往。","xiang":"山下有火，賁；君子以明庶政，無敢折獄。","yao":["初九：賁其趾，舍車而徒。","六二：賁其須。","九三：賁如濡如，永貞吉。","六四：賁如皤如，白馬翰如，匪寇婚媾。","六五：賁於丘園，束帛戔戔，吝，終吉。","上九：白賁，無咎。"],"m":"重視外在與形式的修飾，但內在才是根本。"},{"id":"000001","name":"剝","sym":"䷖","ci":"剝：不利有攸往。","xiang":"山附地上，剝；上以厚下，安宅。","yao":["初六：剝床以足，蔑貞凶。","六二：剝床以辨，蔑貞凶。","六三：剝之，無咎。","六四：剝床以膚，凶。","六五：貫魚，以宮人寵，無不利。","上九：碩果不食，君子得輿，小人剝廬。"],"m":"根基被侵蝕，宜守不宜攻，先保護好自己。"},{"id":"100000","name":"復","sym":"䷗","ci":"復：亨。出入無疾，朋來無咎。反復其道，七日來復，利有攸往。","xiang":"雷在地中，復；先王以至日閉關，商旅不行，後不省方。","yao":["初九：不復遠，無祗悔，元吉。","六二：休復，吉。","六三：頻復，厲無咎。","六四：中行獨復。","六五：敦復，無悔。","上六：迷復，凶，有災眚。用行師，終有大敗，以其國君，凶；至於十年，不克征。"],"m":"一陽來復，低谷已過，正在慢慢回升。"},{"id":"100111","name":"無妄","sym":"䷘","ci":"無妄：元亨，利貞。其匪正有眚，不利有攸往。","xiang":"天下雷行，物與無妄；先王以茂對時，育萬物。","yao":["初九：無妄，往吉。","六二：不耕獲，不災畬，則利有攸往。","六三：無妄之災，或系之牛，行人之得，邑人之災。","九四：可貞，無咎。","九五：無妄之疾，勿藥有喜。","上九：無妄，行有眚，無攸利。"],"m":"不妄為就無災，照著正道走，不投機。"},{"id":"111001","name":"大畜","sym":"䷙","ci":"大畜：利貞，不家食吉，利涉大川。","xiang":"天在山中，大畜；君子以多識前言往行，以畜其德。","yao":["初九：有厲利已。","九二：輿說輹。","九三：良馬逐，利艱貞。曰閑輿衛，利有攸往。","六四：童牛之牿，元吉。","六五：豶豕之牙，吉。","上九：何天之衢，亨。"],"m":"大量累積的時候，蓄積實力，為下一步做準備。"},{"id":"100001","name":"頤","sym":"䷚","ci":"頤：貞吉。觀頤，自求口實。","xiang":"山下有雷，頤；君子以慎言語，節飲食。","yao":["初九：舍爾靈龜，觀我朵頤，凶。","六二：顛頤，拂經，於丘頤，征凶。","六三：拂頤，貞凶，十年勿用，無攸利。","六四：顛頤，吉，虎視眈眈，其欲逐逐，無咎。","六五：拂經，居貞吉，不可涉大川。","上九：由頤，厲吉，利涉大川。"],"m":"重在養，照顧好身心與言語，也慎選所吸收的。"},{"id":"011110","name":"大過","sym":"䷛","ci":"大過：棟橈，利有攸往，亨。","xiang":"澤滅木，大過；君子以獨立不懼，遯世無悶。","yao":["初六：藉用白茅，無咎。","九二：枯楊生稊，老夫得其女妻，無不利。","九三：棟橈，凶。","九四：棟隆，吉；有它吝。","九五：枯楊生華，老婦得士夫，無咎無譽。","上六：過涉滅頂，凶，無咎。"],"m":"負擔過重，需要非常的決斷，但別硬撐到底。"},{"id":"010010","name":"坎","sym":"䷜","ci":"坎：習坎，有孚，維心亨，行有尚。","xiang":"水洊至，習坎；君子以常德行，習教事。","yao":["初六：習坎，入於坎窞，凶。","九二：坎有險，求小得。","六三：來之坎坎，險且枕，入於坎窞，勿用。","六四：樽酒簋貳，用缶，納約自牖，終無咎。","九五：坎不盈，祗既平，無咎。","上六：系用徽纆，置於叢棘，三歲不得，凶。"],"m":"重重險阻，保持誠信與耐心，一步步渡過。"},{"id":"101101","name":"離","sym":"䷝","ci":"離：利貞，亨。畜牝牛，吉。","xiang":"明兩作離，大人以繼明照於四方。","yao":["初九：履錯然，敬之無咎。","六二：黃離，元吉。","九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。","九四：突如其來如，焚如，死如，棄如。","六五：出涕沱若，戚嗟若，吉。","上九：王用出征，有嘉折首，獲匪其醜，無咎。"],"m":"光明與依附，找到對的依靠，就能發光。"},{"id":"001110","name":"咸","sym":"䷞","ci":"咸，亨，利貞，取女吉。","xiang":"山上有澤，咸，君子以虛受人。","yao":["初六，咸其拇。","六二，咸其腓，凶，居吉。","九三，咸其股，執其隨，往吝。","九四，貞吉，悔亡，憧憧往來，朋從爾思。","九五，咸其脢，無悔。","上六，咸其輔頰舌。"],"m":"彼此感應、心意相通，真誠就能打動人。"},{"id":"011100","name":"恒","sym":"䷟","ci":"恒：亨，無咎，利貞，利有攸往。","xiang":"雷風，恒；君子以立不易方。","yao":["初六：浚恒，貞凶，無攸利。","九二：悔亡。","九三：不恒其德，或承之羞，貞吝。","九四：田無禽。","六五：恒其德，貞，婦人吉，夫子凶。","上六：振恒，凶。"],"m":"持之以恆，維持長久的關係與節奏最重要。"},{"id":"001111","name":"遯","sym":"䷠","ci":"遯：亨，小利貞。","xiang":"天下有山，遯；君子以遠小人，不惡而嚴。","yao":["初六：遯尾，厲，勿用有攸往。","六二：執之用黃牛之革，莫之勝說。","九三：系遯，有疾厲，畜臣妾吉。","九四：好遯，君子吉，小人否。","九五：嘉遯，貞吉。","上九：肥遯，無不利。"],"m":"適時退讓，避開鋒頭，保存實力。"},{"id":"111100","name":"大壯","sym":"䷡","ci":"大壯：利貞","xiang":"雷在天上，大壯；君子以非禮勿履。","yao":["初九：壯於趾，征凶，有孚。","九二：貞吉。","九三：小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。","九四：貞吉悔亡，藩決不羸，壯於大輿之輹。","六五：喪羊於易，無悔。","上六：羝羊觸藩，不能退，不能遂，無攸利，艱則吉。"],"m":"氣勢正盛，但盛極要守正，避免衝過頭。"},{"id":"000101","name":"晉","sym":"䷢","ci":"晉：康侯用錫馬蕃庶，晝日三接。","xiang":"明出地上，晉；君子以自昭明德。","yao":["初六：晉如，摧如，貞吉。罔孚，裕無咎。","六二：晉如，愁如，貞吉。受茲介福，於其王母。","六三：眾允，悔亡。","九四：晉如碩鼠，貞厲。","六五：悔亡，失得勿恤，往吉，無不利。","上九：晉其角，維用伐邑，厲吉無咎，貞吝。"],"m":"步步高升，表現會被看見，適合往前。"},{"id":"101000","name":"明夷","sym":"䷣","ci":"明夷：利艱貞。","xiang":"明入地中，明夷；君子以蒞眾，用晦而明。","yao":["初九：明夷於飛，垂其翼。君子於行，三日不食，有攸往，主人有言。","六二：明夷，夷於左股，用拯馬壯，吉。","九三：明夷於南狩，得其大首，不可疾貞。","六四：入於左腹，獲明夷之心，出於門庭。","六五：箕子之明夷，利貞。","上六：不明晦，初登於天，後入於地。"],"m":"光明受傷，暫時韜光養晦，保護自己。"},{"id":"101011","name":"家人","sym":"䷤","ci":"家人：利女貞。","xiang":"風自火出，家人；君子以言有物，而行有恒。","yao":["初九：閑有家，悔亡。","六二：無攸遂，在中饋，貞吉。","九三：家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。","六四：富家，大吉。","九五：王假有家，勿恤，往吉。","上九：有孚威如，終吉。"],"m":"回到家庭與內部，各守其位，關係就穩。"},{"id":"110101","name":"睽","sym":"䷥","ci":"睽：小事吉。","xiang":"上火下澤，睽；君子以同而異。","yao":["初九：悔亡，喪馬勿逐，自復；見惡人無咎。","九二：遇主於巷，無咎。","六三：見輿曳，其牛掣，其人天且劓，無初有終。","九四：睽孤，遇元夫，交孚，厲無咎。","六五：悔亡，厥宗噬膚，往何咎。","上九：睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。"],"m":"意見相左、彼此疏離，求同存異才能化解。"},{"id":"001010","name":"蹇","sym":"䷦","ci":"蹇：利西南，不利東北；利見大人，貞吉。","xiang":"山上有水，蹇；君子以反身修德。","yao":["初六：往蹇，來譽。","六二：王臣蹇蹇，匪躬之故。","九三：往蹇來反。","六四：往蹇來連。","九五：大蹇朋來。","上六：往蹇來碩，吉；利見大人。"],"m":"前路艱難，停下來找幫手，比硬闖好。"},{"id":"010100","name":"解","sym":"䷧","ci":"解：利西南，無所往，其來復吉。有攸往，夙吉。","xiang":"雷雨作，解；君子以赦過宥罪。","yao":["初六：無咎。","九二：田獲三狐，得黃矢，貞吉。","六三：負且乘，致寇至，貞吝。","九四：解而拇，朋至斯孚。","六五：君子維有解，吉；有孚於小人。","上六：公用射隼於高墉之上，獲之，無不利。"],"m":"困難開始鬆動，問題得以化解，宜把握。"},{"id":"110001","name":"損","sym":"䷨","ci":"損：有孚，元吉，無咎，可貞，利有攸往。曷之用，二簋可用享。","xiang":"山下有澤，損；君子以懲忿窒欲。","yao":["初九：巳事遄往，無咎，酌損之。","九二：利貞，征凶，弗損，益之。","六三：三人行，則損一人；一人行，則得其友。","六四：損其疾，使遄有喜，無咎。","六五：或益之，十朋之龜弗克違，元吉。","上九：弗損益之，無咎，貞吉，有攸往，得臣無家。"],"m":"有捨才有得，先付出、減少不必要的，反而受益。"},{"id":"100011","name":"益","sym":"䷩","ci":"益：利有攸往，利涉大川。","xiang":"風雷，益；君子以見善則遷，有過則改。","yao":["初九：利用為大作，元吉，無咎。","六二：或益之，十朋之龜弗克違，永貞吉。王用享於帝，吉。","六三：益之用凶事，無咎。有孚中行，告公用圭。","六四：中行，告公從。利用為依遷國。","九五：有孚惠心，勿問元吉。有孚惠我德。","上九：莫益之，或擊之，立心勿恒，凶。"],"m":"增益之時，適合行動與投入，也記得助人。"},{"id":"111110","name":"夬","sym":"䷪","ci":"夬：揚於王庭，孚號，有厲，告自邑，不利即戎，利有攸往。","xiang":"澤上於天，夬；君子以施祿及下，居德則忌。","yao":["初九：壯於前趾，往不勝為咎。","九二：惕號，莫夜有戎，勿恤。","九三：壯於頄，有凶。君子夬夬，獨行，遇雨，若濡，有慍，無咎。   ","九四：臀無膚，其行次且。牽羊悔亡，聞言不信。","九五：莧陸夬夬，中行無咎。","上六：無號，終有凶。"],"m":"需要果斷做決定，把話說清楚，但別傷人。"},{"id":"011111","name":"姤","sym":"䷫","ci":"姤：女壯，勿用取女。","xiang":"天下有風，姤；後以施命誥四方。","yao":["初六：系於金柅，貞吉，有攸往，見凶，羸豕孚踟躅。","九二：包有魚，無咎，不利賓。","九三：臀無膚，其行次且，厲，無大咎。   ","九四：包無魚，起凶。","九五：以杞包瓜，含章，有隕自天。九五：以杞包瓜，含章，有隕自天。","上九：姤其角，吝，無咎。"],"m":"不期而遇，新的人事出現，要看清再投入。"},{"id":"000110","name":"萃","sym":"䷬","ci":"萃：亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。","xiang":"澤上於地，萃；君子以除戎器，戒不虞。","yao":["初六：有孚不終，乃亂乃萃，若號一握為笑，勿恤，往無咎。","六二：引吉，無咎，孚乃利用禴。","六三：萃如，嗟如，無攸利，往無咎，小吝。   ","九四：大吉，無咎。","九五：萃有位，無咎。匪孚，元永貞，悔亡。","上六：賫咨涕洟，無咎。"],"m":"人氣與資源聚集，適合凝聚眾人、舉辦大事。"},{"id":"011000","name":"升","sym":"䷭","ci":"升：元亨，用見大人，勿恤，南征吉。","xiang":"地中生木，升；君子以順德，積小以高大。","yao":["初六：允升，大吉。","九二：孚乃利用禴，無咎。","九三：升虛邑。   ","六四：王用亨於岐山，吉無咎。","六五：貞吉，升階。","上六：冥升，利於不息之貞。"],"m":"穩步上升，循序漸進，貴人提攜。"},{"id":"010110","name":"困","sym":"䷮","ci":"困：亨，貞，大人吉，無咎，有言不信。","xiang":"澤無水，困；君子以致命遂誌。","yao":["初六：臀困於株木，入於幽谷，三歲不覿。","九二：困於酒食，朱紱方來，利用享祀，征凶，無咎。","六三：困於石，據於蒺藜，入於其宮，不見其妻，凶。   ","九四：來徐徐，困於金車，吝，有終。","九五：劓刖，困於赤紱，乃徐有說，利用祭祀。","上六：困於葛藟，於臲卼，曰動悔。有悔，征吉。"],"m":"處境受困，言多無益，守住信念等待轉機。"},{"id":"011010","name":"井","sym":"䷯","ci":"井：改邑不改井，無喪無得，往來井井。汔至，亦未繘井，羸其瓶，凶。","xiang":"木上有水，井；君子以勞民勸相。","yao":["初六：井泥不食，舊井無禽。","九二：井谷射鮒，甕敝漏。","九三：井渫不食，為我心惻，可用汲，王明，並受其福。   ","六四：井甃，無咎。","九五：井冽，寒泉食。","上六：井收勿幕，有孚元吉。"],"m":"資源穩定、取之不竭，重在維護與經營。"},{"id":"101110","name":"革","sym":"䷰","ci":"革：巳日乃孚，元亨利貞，悔亡。","xiang":"澤中有火，革；君子以治歷明時。","yao":["初九：鞏用黃牛之革。","六二：巳日乃革之，征吉，無咎。","九三：征凶，貞厲，革言三就，有孚。   ","九四：悔亡，有孚改命，吉。","九五：大人虎變，未占有孚。","上六：君子豹變，小人革面，征凶，居貞吉。"],"m":"變革的時機到了，準備好就勇敢改變。"},{"id":"011101","name":"鼎","sym":"䷱","ci":"鼎：元吉，亨。","xiang":"木上有火，鼎；君子以正位凝命。","yao":["初六：鼎顛趾，利出否，得妾以其子，無咎。","九二：鼎有實，我仇有疾，不我能即，吉。","九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。   ","九四：鼎折足，覆公餗，其形渥，凶。","六五：鼎黃耳，金鉉，利貞。","上九：鼎玉鉉，大吉，無不利。"],"m":"除舊佈新、建立新局，適合承擔重任。"},{"id":"100100","name":"震","sym":"䷲","ci":"震：亨。震來虩虩，笑言啞啞。震驚百裏，不喪匕鬯。","xiang":"虩雷，震；君子以恐懼修身。","yao":["初九：震來虩虩，後笑言啞啞，吉。","六二：震來厲，億喪貝，躋於九陵，勿逐，七日得。","六三：震蘇蘇，震行無眚。   ","九四：震遂泥。","六五：震往來厲，億無喪，有事。","上六：震索索，視矍矍，征凶。震不於其躬，於其鄰，無咎。婚媾有言。"],"m":"突如其來的震動，驚過之後反而更清醒。"},{"id":"001001","name":"艮","sym":"䷳","ci":"艮：艮其背，不獲其身，行其庭，不見其人，無咎。","xiang":"兼山，艮；君子以思不出其位。","yao":["初六：艮其趾，無咎，利永貞。","六二：艮其腓，不拯其隨，其心不快。","九三：艮其限，列其夤，厲薰心。","六四：艮其身，無咎。","六五：艮其輔，言有序，悔亡。","上九：敦艮，吉。"],"m":"該停就停，靜下來，不要勉強前進。"},{"id":"001011","name":"漸","sym":"䷴","ci":"漸：女歸吉，利貞。","xiang":"山上有木，漸；君子以居賢德，善俗。","yao":["初六：鴻漸于干，小子厲，有言，無咎。","六二：鴻漸於磐，飲食衎衎，吉。","九三：鴻漸於陸，夫征不復，婦孕不育，凶；利禦寇。","六四：鴻漸於木，或得其桷，無咎。","九五：鴻漸於陵，婦三歲不孕，終莫之勝，吉。","上九：鴻漸於陸，其羽可用為儀，吉。"],"m":"循序漸進，慢慢來反而最穩。"},{"id":"110100","name":"歸妹","sym":"䷵","ci":"歸妹：征凶，無攸利。","xiang":"澤上有雷，歸妹；君子以永終知敝。","yao":["初九：歸妹以娣，跛能履，征吉。","九二：眇能視，利幽人之貞。","六三：歸妹以須，反歸以娣。","九四：歸妹愆期，遲歸有時。","六五：帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。","上六：女承筐無實，士刲羊無血，無攸利。"],"m":"名分與時機需留意，不宜強求，先看清關係。"},{"id":"101100","name":"豐","sym":"䷶","ci":"豐：亨，王假之，勿憂，宜日中。","xiang":"雷電皆至，豐；君子以折獄致刑。","yao":["初九：遇其配主，雖旬無咎，往有尚。","六二：豐其蔀，日中見鬥，往得疑疾，有孚發若，吉。","九三：豐其沛，日中見沫，折其右肱，無咎。","九四：豐其蔀，日中見鬥，遇其夷主，吉。","六五：來章，有慶譽，吉。","上六：豐其屋，蔀其家，闚其戶，闃其無人，三歲不覿，凶。"],"m":"盛大豐滿之時，把握當下，也預備轉變。"},{"id":"001101","name":"旅","sym":"䷷","ci":"旅：小亨，旅貞吉。","xiang":"山上有火，旅；君子以明慎用刑，而不留獄。","yao":["初六：旅瑣瑣，斯其所取災。","六二：旅即次，懷其資，得童仆貞。","九三：旅焚其次，喪其童仆，貞厲。","九四：旅於處，得其資斧，我心不快。","六五：射雉一矢亡，終以譽命。","上九：鳥焚其巢，旅人先笑後號啕。喪牛於易，凶。"],"m":"在外漂泊、處於過渡，謹慎低調，守住本分。"},{"id":"011011","name":"巽","sym":"䷸","ci":"巽：小亨，利攸往，利見大人。","xiang":"隨風，巽；君子以申命行事。","yao":["初六：進退，利武人之貞。","九二：巽在床下，用史巫紛若，吉，無咎。","九三：頻巽，吝。","六四：悔亡，田獲三品。","九五：貞吉悔亡，無不利。無初有終，先庚三日，後庚三日，吉。","上九：巽在床下，喪其資斧，貞凶。"],"m":"柔順而入，用溝通與彈性慢慢推進。"},{"id":"110110","name":"兌","sym":"䷹","ci":"兌：亨，利貞。","xiang":"麗澤，兌；君子以朋友講習。","yao":["初九：和兌，吉。","九二：孚兌，吉，悔亡。","六三：來兌，凶。","九四：商兌，未寧，介疾有喜。","九五：孚於剝，有厲。","上六：引兌。"],"m":"喜悅與交流，真誠的言語能帶來好結果。"},{"id":"010011","name":"渙","sym":"䷺","ci":"渙：亨。王假有廟，利涉大川，利貞。","xiang":"風行水上，渙；先王以享於帝立廟。","yao":["初六：用拯馬壯，吉。","九二：渙奔其機，悔亡。","六三：渙其躬，無悔。","六四：渙其群，元吉。渙有丘，匪夷所思。","九五：渙汗其大號，渙王居，無咎。","上九：渙其血，去逖出，無咎。"],"m":"人心與局面渙散，需要重新凝聚。"},{"id":"110010","name":"節","sym":"䷻","ci":"節：亨。苦節，不可貞。","xiang":"澤上有水，節；君子以制數度，議德行。","yao":["初九：不出戶庭，無咎。","九二：不出門庭，凶。","六三：不節若，則嗟若，無咎。","六四：安節，亨。","九五：甘節，吉；往有尚。","上六：苦節，貞凶，悔亡。"],"m":"適度節制，訂好界線，過與不及都不好。"},{"id":"110011","name":"中孚","sym":"䷼","ci":"中孚：豚魚吉，利涉大川，利貞。","xiang":"澤上有風，中孚；君子以議獄緩死。","yao":["初九：虞吉，有它不燕。","九二：鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。","六三：得敵，或鼓或罷，或泣或歌。","六四：月幾望，馬匹亡，無咎。","九五：有孚攣如，無咎。","上九：翰音登於天，貞凶。"],"m":"誠信為本，真心能感動人，也能過難關。"},{"id":"001100","name":"小過","sym":"䷽","ci":"小過：亨，利貞，可小事，不可大事。飛鳥遺之音，不宜上，宜下，大吉。","xiang":"山上有雷，小過；君子以行過乎恭，喪過乎哀，用過乎儉。","yao":["初六：飛鳥以凶。","六二：過其祖，遇其妣；不及其君，遇其臣；無咎。","九三：弗過防之，從或戕之，凶。","九四：無咎，弗過遇之。往厲必戒，勿用永貞。","六五：密雲不雨，自我西郊，公弋取彼在穴。","上六：弗遇過之，飛鳥離之，凶，是謂災眚。"],"m":"小事可為、大事宜緩，低調行事。"},{"id":"101010","name":"既濟","sym":"䷾","ci":"既濟：亨，小利貞，初吉終亂。","xiang":"水在火上，既濟；君子以思患而預防之。","yao":["初九：曳其輪，濡其尾，無咎。","六二：婦喪其茀，勿逐，七日得。","九三：高宗伐鬼方，三年克之，小人勿用。","六四：繻有衣袽，終日戒。","九五：東鄰殺牛，不如西鄰之禴祭，實受其福。","上六：濡其首，厲。"],"m":"事情已經完成，但要居安思危，防止轉壞。"},{"id":"010101","name":"未濟","sym":"䷿","ci":"未濟：亨，小狐汔濟，濡其尾，無攸利。","xiang":"火在水上，未濟；君子以慎辨物居方。","yao":["初六：濡其尾，吝。","九二：曳其輪，貞吉。","六三：未濟，征凶，利涉大川。","九四：貞吉，悔亡，震用伐鬼方，三年有賞於大國。","六五：貞吉，無悔，君子之光，有孚，吉。","上九：有孚於飲酒，無咎，濡其首，有孚失是。"],"m":"還沒完成，接近終點更要謹慎，仍有可為。"}];const GBY={};GUA.forEach(g=>GBY[g.id]=g);

function guaCheck(v,book){if(v.length<4)return"再多寫幾個字，讓我知道你在問什麼";if(v.length>60)return"請在 60 個字以內，只問一件事";
  if((v.match(/[？?]/g)||[]).length>1)return book?"一次只問一件事，其他的可以之後再追問":"一次只問一件事，其他的下一卦再問";
  for(const [re,msg] of GUARD)if(re.test(v))return msg;return""}
/* 三枚錢：字＝2、背＝3；6 老陰、7 少陽、8 少陰、9 老陽 */
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}
function toss(){return[0,1,2].map(()=>rnd()<.5?3:2)}
function hexOf(lines){const ben=lines.map(v=>v%2?"1":"0").join("");const chg=lines.map((v,i)=>v===6||v===9?i:-1).filter(i=>i>=0);
  const zhi=lines.map((v,i)=>{const y=v%2;return String(chg.includes(i)?1-y:y)}).join("");return{ben,zhi,chg}}
const yn=s=>s.split(/[：，、]/)[0];
/* 朱熹《易學啟蒙》占法 */
function guaRule(lines){const {ben,zhi,chg}=hexOf(lines);const B=GBY[ben],Z=GBY[zhi],n=chg.length;
  const still=[0,1,2,3,4,5].filter(i=>!chg.includes(i));let r;
  if(n===0)r={main:B,text:[B.ci],label:"沒有變爻，看本卦的卦辭"};
  else if(n===1)r={main:B,text:[B.yao[chg[0]]],label:`一個變爻，看本卦「${yn(B.yao[chg[0]])}」的爻辭`};
  else if(n===2){const u=chg[1];r={main:B,text:[B.yao[u]],label:`兩個變爻，以上面那一爻為主，看「${yn(B.yao[u])}」`}}
  else if(n===3)r={main:B,text:[B.ci,Z.ci],label:`三個變爻，合看本卦與之卦的卦辭，以本卦為主`};
  else if(n===4){const l=still[0];r={main:Z,text:[Z.yao[l]],label:`四個變爻，看之卦裡不變的下一爻「${yn(Z.yao[l])}」`}}
  else if(n===5)r={main:Z,text:[Z.yao[still[0]]],label:`五個變爻，看之卦唯一不變的「${yn(Z.yao[still[0]])}」`};
  else if(B.yao[6])r={main:B,text:[B.yao[6]],label:`六爻全變，${B.name}卦看「${yn(B.yao[6])}」`};
  else r={main:Z,text:[Z.ci],label:"六爻全變，看之卦的卦辭"};
  return{...r,B,Z:n?Z:null,chg,ben,zhi}}
const GUA_LOCK={love:"這一卦落在你們之間，關鍵不在對方怎麼想，而在你接下來那一步要不要先跨出去；變爻提醒的時間點，會落在",

async function guaFlow(t){

  const c=await chips(CATS.map(([l,v])=>({label:l,v})));if(t!==token)return;said(c.label);S.cat=c.v;
  await say("把想問的事寫下來。一次只問一件，寫得越具體越好。",t);if(t!==token)return;
  const q=await field("text","例如："+(CAT_EG[S.cat]||CAT_EG.other),guaCheck);if(t!==token)return;
  S.q=q;S.legal=LEGAL.test(q);said(q);track("gua_question",{cat:S.cat,len:q.length,legal:S.legal});
  if(S.legal){await say("卦不判輸贏，也不算金額。我替你看的，是這件事的時機，和你能怎麼做。",t);if(t!==token)return}
  shot("toss");said("");
  await say("雙手合起，心裡默念這件事。準備好了，就擲。",t);if(t!==token)return;
  guaBoard();guaReset();requestAnimationFrame(()=>gEl.classList.add("on"));
  const lines=[];
  for(let i=0;i<6;i++){
    await chips([{label:i===0?"擲第一次":`擲第 ${i+1} 次`,cls:"main"}]);if(t!==token)return;
    const f=toss(),v=f.reduce((a,b)=>a+b,0);await flip(f);if(t!==token)return;
    lines.push(v);addLine(i,v);$("gval").textContent=`${YPOS[i]}・${f.filter(x=>x===3).length} 背 ${f.filter(x=>x===2).length} 字・${VAL[v]}`;track("gua_toss",{i,v});
    if(i<5)line.textContent=i===2?"下卦成了。再三次。":"";
  }
  S.lines=lines.slice();const R=S.G=guaRule(lines);track("gua_done",{ben:R.B.name,zhi:R.Z&&R.Z.name,chg:R.chg.length});
  await wait(500);gEl.classList.add("done");
  $("gname").innerHTML=`<span><b>${R.B.sym}</b>${R.B.name}</span>`+(R.Z?`<i>→</i><span><b>${R.Z.sym}</b>${R.Z.name}</span>`:"");
  Snd.gong();rt.classList.add("dim");shot("read");
  await say(R.Z?`本卦是「${R.B.name}」，變成「${R.Z.name}」。`:`這一卦，是「${R.B.name}」，沒有變爻。`,t,{tap:true});if(t!==token)return;
  await say(`依朱熹的讀法，${R.label}：`,t);if(t!==token)return;
  await say(R.text.join("　"),t,{tap:true,long:true});if(t!==token)return;
  gEl.classList.add("away");rt.classList.remove("dim");shot("face");setTopic(`${R.main.name}・白話`);
  await say(`白話來說：${R.main.m}`,t,{tap:true,long:true});if(t!==token)return;
  setTopic("落到你問的事上");shot("hush");
  await say(`就你問的「${S.q}」……`,t,{tap:true,long:true,veiled:GUA_LOCK[S.cat]+"……"});if(t!==token)return;
  setTopic("");Snd.gong();track("paywall_view",{product:"gua"});
  await say("這一卦怎麼落到你的事上，要細細說給你聽。",t);if(t!==token)return;
  openGua(t);
}

/* ---------------- 問事流程 ---------------- */
async function dialogue(preset){
  const t=++token;$("rt-box").hidden=false;said("");setTopic("");
  shot("face");
  if(!preset){await say("你來了。燈還亮著，先坐下吧。",t);
  await say("今夜，你想問的是什麼？",t);if(t!==token)return}
  const m=preset?{label:"我這個人",v:preset}:await chips([{html:"我這個人<small>紫微命盤・個性、工作、感情</small>",label:"我這個人",v:"base",cls:"big"},{html:"明年的運<small>2027 丁未流年</small>",label:"明年的運",v:"year",cls:"big"},{html:"我和某個人<small>雙人合盤・緣分與相處</small>",label:"我和某個人",v:"pair",cls:"big"},{html:"心裡有一件事<small>周易問卦・一事一卦</small>",label:"心裡有一件事",v:"gua",cls:"big"}]);if(t!==token)return;
  said(m.label);S.mode=m.v;track("mode_select");
  if(S.mode==="gua")return guaFlow(t);
  shot("close");
  await say("在看你的星之前，我該怎麼稱呼你？",t);if(t!==token)return;
  const who=await whoForm("你的名字或暱稱",[["我是女生","女"],["我是男生","男"]]);if(t!==token)return;
  S.name=who.name;S.sex=who.sex;said(`${who.name}・${who.sex}`);track("step_name");
  shot("hand");
  await say(`${S.name}，你是哪一天來到這個世界的？`,t);if(t!==token)return;
  S.dob=await dobForm({y:1994,m:8,d:17,k:"me"});if(t!==token)return;said(fmtDob(S.dob));track("step_birth",{calendar:S.dob.cal});
  const pre=window.iztro?computeChart(S.dob,6,S.sex):null;
  if(pre&&!pre.demo){const yg=pre.gz.split(" ")[0];await say(`${yg}年，屬${pre.zodiac}。`,t)}
  const h=await askHour(t,"那一刻，大約是什麼時辰？不確定也沒關係。");if(!h||t!==token)return;S.hour=h.v;S.hourIdx=h.i;track("step_hour",{unknown:!!h.unknown});
  if(h.unknown)await say("沒關係，我先用午時替你推算。時辰會影響命宮，之後可以再改。",t);
  if(S.mode!=="pair"){
    shot("mid");
    await say("現在，身邊有人嗎？",t);if(t!==token)return;
    const r=await chips(REL.map(([l,v])=>({label:l,v})));if(t!==token)return;said(r.label);S.rel=r.v;track("step_rel",{rel:r.v});
    if(S.mode==="base"&&(r.v==="single"||r.v==="crush")){await say("你會心動的，是男生還是女生？",t);if(t!==token)return;
      const lk=await chips([{label:"男生",v:"男"},{label:"女生",v:"女"}]);if(t!==token)return;said(lk.label);S.like=lk.v;track("step_like",{like:lk.v})}
    if(S.mode==="base"&&(r.v==="married"||r.v==="dating")){await say("家裡，有小孩了嗎？",t);if(t!==token)return;
      const kd=await chips([{label:"有了",v:"have"},{label:"還沒，想要",v:"want"},{label:"還沒，先不考慮",v:"notyet"},{label:"不想說",v:"skip"}]);if(t!==token)return;said(kd.label);S.kids=kd.v;track("step_kids",{kids:kd.v})}
  }
  await say(S.mode==="pair"?"你最近，都在忙什麼？":"那你最近，都在忙什麼？",t);if(t!==token)return;
  const j=await chips(JOBS.map(([l,v])=>({label:l,v})));if(t!==token)return;said(j.label);S.job=j.v;track("step_job",{job:j.v});
  S.C=computeChart(S.dob,S.hourIdx,S.sex);

    shot("wide");

    const ph=await askHour(t,`${S.pname}是什麼時辰出生的？`);if(!ph||t!==token)return;S.phour=ph.v;
    S.C2=computeChart(S.pdob,ph.i,S.psex);track("step_partner");

  await cast(t);if(t!==token)return;
