<style>
:root{--night:#05070d;--ink:#0d1220;--lamp:#f2cf8e;--gold:#d8b46a;--paper:#e9e4d6;--mute:#9da1ae;--rule:rgba(216,180,106,.28);color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--night) radial-gradient(ellipse at 50% 0%,rgba(242,207,142,.14),transparent 55%);color:var(--paper);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;justify-content:center;padding:48px 16px 40px}
.wrap{width:100%;max-width:440px;text-align:center}
.av{width:112px;height:112px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 32px rgba(242,207,142,.35)}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:30px;letter-spacing:.2em;margin:18px 0 6px;color:#fff4dc}
.lead{color:var(--mute);font-size:15px;line-height:1.8;margin-bottom:28px}
.btn{display:flex;align-items:center;gap:16px;text-align:left;padding:16px 20px;margin-bottom:12px;border:1px solid var(--rule);border-radius:6px;background:rgba(13,18,32,.75);color:var(--paper);text-decoration:none;transition:border-color .2s,background .2s}
.btn:hover,.btn:focus-visible{border-color:var(--gold);background:rgba(216,180,106,.08)}
.btn svg{width:28px;height:28px;fill:var(--gold);flex:none}
.btn b{display:block;font-size:17px}
.btn small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.main{background:var(--lamp);border-color:var(--lamp);color:var(--night);justify-content:center;font-weight:700;font-size:17px;margin-top:22px}
.main:hover,.main:focus-visible{background:#ffe0a6;border-color:#ffe0a6}
.sub{justify-content:center;font-size:15px}
.foot{margin-top:30px;font-size:12px;color:var(--mute)}
.foot a{color:var(--mute)}
</style>
