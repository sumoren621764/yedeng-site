<main class="doc">

<figure class="scene"><img src="img/lamp.webp" alt="提燈的引路人" width="1280" height="850" decoding="async" fetchpriority="high"></figure>
<div class="doc-head"><h1>點燈入內</h1><p class="lead">登入後可以重看買過的命書、使用追問、保存常用生辰。不登入也能購買，用同一個 Email 登入後，舊訂單會自動出現。</p></div>
<section class="panel" aria-labelledby="h-login">
<h2 id="h-login">用 Email 登入</h2>
<form id="f-email" class="stack" novalidate>
<div class="field"><label for="email">Email</label><input id="email" type="email" inputmode="email" autocomplete="email" required placeholder="you@example.com"></div>
<button class="btn primary" type="submit"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>寄登入信給我</button>
</form>
<form id="f-otp" class="stack" hidden novalidate>
<p class="msg">信已經寄到 <b id="sent-to"></b>。點信裡的連結就能登入；如果信裡有 6 位數驗證碼，也可以直接輸入。</p>
<div class="field"><label for="otp">驗證碼</label><input id="otp" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></div>
<button class="btn primary" type="submit">登入</button>
<button class="btn ghost" type="button" id="resend">重新輸入 Email</button>
</form>
<p class="msg" id="m-email" role="alert"></p>
<div class="or">或</div>
<div class="stack">
<button class="btn google" type="button" id="b-google"><svg class="ic" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>使用 Google 登入</button>
<a class="btn line" id="b-line" href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 2.5C6.2 2.5 1.5 6.3 1.5 11c0 4.2 3.7 7.7 8.8 8.4.35.07.82.23.94.53.1.27.07.7.03.97l-.15.9c-.05.27-.21 1.04.91.57 1.12-.47 6.04-3.56 8.24-6.09C21.8 14.6 22.5 12.9 22.5 11c0-4.7-4.7-8.5-10.5-8.5z"/><path fill="#06c755" d="M8.9 13.4H6.8c-.3 0-.55-.25-.55-.55V8.7c0-.3.25-.55.55-.55s.55.25.55.55v3.6h1.55c.3 0 .55.25.55.55s-.25.55-.55.55zm1.9-.55c0 .3-.25.55-.55.55s-.55-.25-.55-.55V8.7c0-.3.25-.55.55-.55s.55.25.55.55v4.15zm5 0c0 .24-.15.45-.38.52-.06.02-.11.03-.17.03-.17 0-.33-.08-.44-.22l-2.13-2.9v2.57c0 .3-.25.55-.55.55s-.55-.25-.55-.55V8.7c0-.24.15-.45.38-.52.05-.02.11-.03.17-.03.17 0 .33.09.43.22l2.14 2.9V8.7c0-.3.25-.55.55-.55s.55.25.55.55v4.15zm3.35-2.62c.3 0 .55.25.55.55s-.25.55-.55.55h-1.55v.98h1.55c.3 0 .55.25.55.55s-.25.55-.55.55h-2.1c-.3 0-.55-.25-.55-.55V8.7c0-.3.25-.55.55-.55h2.1c.3 0 .55.25.55.55s-.25.55-.55.55h-1.55v.98h1.55z"/></svg>使用 LINE 登入</a>

<script src="yd.js"></script>
<script>

(function(){
  var p=new URLSearchParams(location.search), next=YD.safeNext(p.get("next")), $=YD.$, m=$("#m-email");
  var bind=p.get("mode")==="bind", ex=bind?"/auth/link-email":"/auth/session", back=location.origin+"/login.html?"+(bind?"mode=bind&":"")+"next="+encodeURIComponent(next);
  if(bind){$("#h-login").textContent="綁定 Email";$(".or").hidden=true;$("#b-google").hidden=true;$("#b-line").hidden=true;}
  if(p.get("error")==="line"){m.className="msg bad";m.textContent="LINE 登入沒有完成，請再試一次。";}
  $("#b-line").href=YD.cfg.api+"/auth/line/start?next="+encodeURIComponent(next);
  function done(){location.replace(next);}
  // 已經登入就直接過去；從 Email 連結或 Google 回來時，把登入換成本站 session
  function tryExchange(){YD.exchange(ex).then(function(ok){if(ok)done();}).catch(function(e){m.className="msg bad";m.textContent=e.message;});}
  if(bind) tryExchange(); else YD.api("/me").then(done,tryExchange);
  var email="";
  $("#f-email").addEventListener("submit",function(ev){
    ev.preventDefault(); email=$("#email").value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){m.className="msg bad";m.textContent="Email 格式不正確";return;}
    var b=ev.submitter||this.querySelector("button"); YD.busy(b,true,"寄送中…"); m.textContent="";
    YD.sb().then(function(c){return c.auth.signInWithOtp({email:email,options:{emailRedirectTo:back}});})
    .then(function(r){ if(r.error) throw r.error;
      $("#sent-to").textContent=email; $("#f-email").hidden=true; $("#f-otp").hidden=false; $("#otp").focus(); })
    .catch(function(e){m.className="msg bad";m.textContent=/rate|seconds/i.test(e.message||"")?"寄太頻繁了，請等一分鐘再試":"寄送失敗，請稍後再試";})
    .then(function(){YD.busy(b,false);});
  });
  $("#f-otp").addEventListener("submit",function(ev){
    ev.preventDefault(); var code=$("#otp").value.replace(/\D/g,"");
    if(code.length!==6){m.className="msg bad";m.textContent="請輸入 6 位數驗證碼";return;}
    var b=ev.submitter||this.querySelector("button[type=submit]"); YD.busy(b,true,"登入中…");
    YD.sb().then(function(c){return c.auth.verifyOtp({email:email,token:code,type:"email"});})
    .then(function(r){if(r.error) throw r.error; return YD.exchange(ex);})
    .then(function(ok){if(ok)done();})
    .catch(function(){m.className="msg bad";m.textContent="驗證碼不正確或已過期";YD.busy(b,false);});
  });
  $("#resend").addEventListener("click",function(){$("#f-otp").hidden=true;$("#f-email").hidden=false;m.textContent="";});
  $("#b-google").addEventListener("click",function(){
    YD.sb().then(function(c){return c.auth.signInWithOAuth({provider:"google",options:{redirectTo:back}});})
    .catch(function(e){m.className="msg bad";m.textContent=e.message;});
  });
})();

</script>
